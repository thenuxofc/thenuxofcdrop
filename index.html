* { box-sizing: border-box; margin: 0; padding: 0; }

.d1 { background: #ff5f57; }
.d2 { background: #febc2e; }

.term-title { color: #555; font-size: 12px; margin-left: auto; margin-right: auto; letter-spacing: 1px; }
.term-body {

.line {

}
.line.dim { color: #00aa2a; text-shadow: none; }
.line.bright { color: #39ff14; text-shadow: 0 0 8px #39ff1480; }
.line.cyan { color: #00ffff; text-shadow: 0 0 6px #00ffff50; }
.line.yellow { color: #ffff00; text-shadow: 0 0 6px #ffff0040; }
.line.red { color: #ff4444; text-shadow: 0 0 6px #ff444440; }
.line.white { color: #cccccc; text-shadow: none; }
.cursor {
  display: inline-block;
  width: 8px;
  height: 14px;
  background: #00ff41;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
  margin-left: 1px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.scanline {
  pointer-events: none;
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.08) 3px,
    rgba(0,0,0,0.08) 4px
  );
  border-radius: 10px;
}
.btn-row { display: flex; gap: 8px; padding: 12px 20px; background: #050505; border-top: 1px solid #111; flex-wrap: wrap; }
.tbtn {
  background: #001a00;
  color: #00ff41;
  border: 1px solid #00ff4140;
  border-radius: 6px;
  padding: 6px 14px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: background 0.15s, border-color 0.15s;
}
.tbtn:hover { background: #003300; border-color: #00ff41; }
.tbtn:active { transform: scale(0.97); }
</style>

function clearTerm() {
  typing = false;
  queue = [];
  out.innerHTML = '';
}

function addLine(cls, text) {
  const d = document.createElement('div');
  d.className = 'line ' + (cls === 'line' ? '' : cls);
  d.textContent = text;
  out.appendChild(d);
  out.parentElement.scrollTop = out.parentElement.scrollHeight;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typePrompt(text) {
  const d = document.createElement('div');
  d.className = 'line bright';
  out.appendChild(d);
  const prefix = 'thenux@dev:~$ ';
  const full = prefix + text;
  for (let i = 0; i < full.length; i++) {
    d.textContent = full.slice(0, i + 1);
    await sleep(text === '' ? 0 : 40 + Math.random() * 30);
    out.parentElement.scrollTop = out.parentElement.scrollHeight;
  }
}

async function runScript(name) {
  if (typing) return;
  typing = true;
  cur.style.display = 'none';
  const steps = scripts[name];
  for (const step of steps) {
    if (!typing) break;
    if (step.t === 'prompt') {
      await typePrompt(step.text);
      await sleep(120);
    } else if (step.t === 'gap') {
      addLine('line', '');
      await sleep(60);
    } else {
      addLine(step.t, step.text);
      await sleep(28 + Math.random() * 18);
    }
  }
  cur.style.display = 'inline-block';
  typing = false;
}
